name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip AppLauncher.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # --- НОВЫЙ ШАГ: Генерация gradlew ---
      - name: Generate Gradle Wrapper
        run: |
          # Ищем папку, где лежит build.gradle.kts (корень проекта)
          PROJECT_DIR=$(find . -name "build.gradle.kts" -maxdepth 2 -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Не найден файл build.gradle.kts!"
            exit 1
          fi
          echo "Проект найден в папке: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Скачиваем Gradle и генерируем wrapper
          gradle wrapper --gradle-version 8.2
      # -------------------------------------

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -name "build.gradle.kts" -maxdepth 2 -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/*.apk'
